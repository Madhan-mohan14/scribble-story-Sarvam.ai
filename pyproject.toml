[project]
name = "scribble-story"
version = "0.1.0"
description = "A kids' app: draw a picture, click Make Story, get an exciting story using Gemini 2.5 Flash VLM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "google-genai>=0.1.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
    "sarvamai>=0.1.30",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
